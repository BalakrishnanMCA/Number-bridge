<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="chat-container">
      <!-- Header -->
      <div class="chat-header">
        <div class="contact-info">
          <div class="contact-name" th:text="${contactName}">John Doe</div>
          <div class="contact-number" th:text="${contactNumber}">
            +91 9876543210
          </div>
        </div>
        <div class="chat-options">
          <button id="menuBtn" class="menu-btn">⋮</button>
          <div id="menuDropdown" class="dropdown">
            <button id="blockUser">Block User</button>
            <button id="clearChat">Clear Chat</button>
            <button id="callUser">Call</button>
          </div>
        </div>
      </div>

      <!-- Chat messages -->
      <div class="chat-messages" id="chatMessages"></div>

      <!-- Typing area -->
      <!-- Delete options bar -->
      <div id="deleteBar" class="delete-bar" style="display: none">
        <button id="deleteMeBtn">Delete for Me</button>
        <button id="deleteEveryoneBtn">Delete for Everyone</button>
      </div>

      <div id="mediaPreview" class="media-preview">
        <span id="closePreview" class="close-preview">&times;</span>
        <div class="preview-content"></div>
      </div>

      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="fileBtn">+</button>
        <input type="file" id="fileInput" style="display: none" multiple />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script th:src="@{/js/chat.js}">   </script>

  </body>
</html>
