<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Number Bridge</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <style>
    /* Global body background and layout */
    body {
      font-family: "Roboto", Arial, Helvetica, sans-serif;
      background-image: url("/assets/bg.jpg"); /* must exist in static/assets */
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
    }

    /* Large faded background text */
    .number-bridge-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 7rem;
      color: rgba(255, 255, 255, 0.08); /* lighter fade */
      /* font-weight: 750; */
      z-index: 0;
      pointer-events: none;
      user-select: none;
      text-align: center;
      font-family: "Roboto", "Segoe UI", "Arial Black", Arial, Helvetica,
        sans-serif;
      text-shadow: 2px 4px 16px rgba(0, 0, 0, 0.12);
    }

    /* Container */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 40px 50px;
      width: 420px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(18px);
    }

    /* Heading */
    .card h2 {
      font-size: 30px;
      margin-bottom: 15px;
      color: #fff;
      font-weight: 700;
      text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.3);
    }

    /* Paragraph */
    .card p {
      font-size: 15px;
      line-height: 1.6;
      color: #ddd;
      margin-bottom: 25px;
    }

    /* Buttons (shared style) */
    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s ease;
    }

    /* Primary (Register button) */
    .button-primary {
      background: #3498db;
      color: #fff;
    }

    .button-primary:hover {
      background: #2980b9;
    }

    /* Secondary (Login button) */
    .button-secondary {
      background: #10b981;
      color: #fff;
    }

    .button-secondary:hover {
      background: #059669;
    }
  </style>
  <body>
    <div class="number-bridge-bg">Number Bridge</div>
    <div class="container">
      <div class="card">
        <h2>Welcome to Number Bridge</h2>
        <p style="text-align: center; margin-bottom: 20px">
          Connect with your friends securely using phone number chat.
        </p>
        <!-- <button class="button button-primary" onclick="window.location.href='/register.html'">Register</button>
      <button class="button" style="background:#10b981; color:white; margin-top:12px;" onclick="window.location.href='/login.html'">Login</button> -->
        <button
          class="button button-primary"
          th:onclick="'location.href=\''+@{/register}+'\';'"
        >
          Register
        </button>
        <button
          class="button button-secondary"
          th:onclick="'location.href=\''+@{/login}+'\';'"
        >
          Login
        </button>
      </div>
    </div>
  </body>
</html>
