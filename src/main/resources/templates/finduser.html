<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Home</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="/assets/app.js"></script>
  </head>
  <style>
    /* Background and center alignment */
    body {
      font-family: "Roboto", Arial, Helvetica, sans-serif;
      background-image: url("/assets/bg.jpg");
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Large faded background text */
    .number-bridge-bg {
      position: center;
      /* top: 30%;
      left: 50%; */
      transform: translate(-50%, -11%);
      font-size: 4rem;
      color: rgba(255, 255, 255, 0.08);
      font-weight: 400;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      text-align: center;
      font-family: "Roboto", "Segoe UI", "Arial Black", Arial, Helvetica,
        sans-serif;
      text-shadow: 2px 4px 16px rgba(0, 0, 0, 0.12);
    }

    /* Container centers content */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      z-index: 1;
    }

    /* Glassmorphism card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 30px 40px;
      width: 500px;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
      text-align: center;
      z-index: 1;
    }

    /* Heading */
    .card h2 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    /* Input fields */
    .input {
      width: 100%;
      height: 50px;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      font-size: 16px;
      color: #101010;
      padding: 0 20px;
      margin: 15px 0;
      outline: none;
    }

    .input::placeholder {
      color: #ddd;
    }

    /* Buttons */
    .button {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s ease;
    }

    /* Primary button */
    .button-primary {
      background: #3498db;
      color: #fff;
    }

    .button-primary:hover {
      background: #2980b9;
    }

    /* User list */
    .user-list {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
    }

    .user-item {
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: background 0.3s ease;
      color: #fff;
    }

    .user-item:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
  <body>
    <div class="number-bridge-bg">Number Bridge</div>
    <div id="root"></div>

    <form
      id="chatForm"
      th:action="@{/chat}"
      method="get"
      onsubmit="return fun(event)"
    >
      <input
        id="num2"
        type="text"
        name="phoneNumber"
        class="input"
        placeholder="Search by phone"
      />
      <button class="button button-primary" type="submit">Find</button>
    </form>

    <script>
      async function findUser(event) {
        event.preventDefault();

        const num = document.getElementById("num2").value.trim();
        const userMobile = localStorage.getItem("userMobile"); // your own mobile stored previously

        if (!num) {
          alert("Please enter a phone number");
          return false;
        }

        if (num === userMobile) {
          alert("You can't message yourself");
          return false;
        }

        try {
          const response = await fetch(
            `/chat?phoneNumber=${encodeURIComponent(num)}`
          );
          const text = await response.text();

          if (text === "USER_NOT_FOUND") {
            alert("User not found");
          } else if (text === "OK") {
            // Save selected user and go to chat
            localStorage.setItem("chatPartnerMobile", num);
            window.location.href =
              "/chat.html?userId=" + encodeURIComponent(num);
          } else {
            alert("Unexpected response: " + text);
          }
        } catch (error) {
          console.error(error);
          alert("Something went wrong!");
        }

        return false;
      }
    </script>
  </body>
</html>
